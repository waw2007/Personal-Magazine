<!DOCTYPE html>

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Magazine</title>
  <link rel="stylesheet" href="widget.css" />
</head>
<body>

      <div class="w-section">
        <h3>⏰ 提醒</h3>

      </div>
      <div class="w-section">
        <h3>🆕 最新</h3>
        <ul id="latest"><li class="muted">加载中…</li></ul>
      </div>
    </div>
  </div>
  <script src="widget.js"></script>
</body>
</html>
